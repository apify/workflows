name: Check the merge readiness of release PR

# If all of the reviewers (people with commit in the release) have approved the changes,
# this workflow will send a message to the #engineering-releases channel (a reply to the release thread)
# telling the deploy duty, that the PR is ready to be released.
# 1) fetchPendingReviews -> if there are some, exit
# 2) fetch deploy duty and the release Slack thread id
# 3) send a message to Slack, tagging the current deploy duty

on:
  workflow_dispatch:

  pull_request_review:
    types:
      - submitted

jobs:
  notify_when_ready_to_merge:
    # Unfortunatelly there is no way to specify this in the `on:` part of the workflow
    # as in `pull_request`.
    #   -> We have to check if the job should run here (if the PR is a release PR).
    if: |
      github.event.pull_request.base.ref == 'master' &&
        startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4
        with:
          # Make the checkout a small bit faster by only checking out the scripts directory.
          sparse-checkout: 'scripts'
          sparse-checkout-cone-mode: false # Excludes files from project root

      - name: Send notification if all reviewers submitted their review
        uses: actions/github-script@v8.0.0
        env:
          # THIS IS A COPY FROM `release_staging.yaml`
          #
          # Key-value store that we use to remember started Slack threads for pending releases. This allows us to avoid double
          # posting. The store is under the apify-platform account.
          # Tip: To quickly erase the thread ID from the store during testing, you can use the following command:
          # curl -X DELETE "https://api.apify.com/v2/key-value-stores/3EfC58GUAEGruKLoY/records/<PR_NUMBER>?token=${APIFY_TOKEN}"
          SLACK_THREADS_STORE_ID: '3EfC58GUAEGruKLoY'
          SLACK_CHANNEL_ID: 'C0AGAN0JM39' #engineering-releases
          APIFY_API_TOKEN: ${{ secrets.APIFY_PLATFORM_SCOPED_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          SLACK_API_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
          PAGERDUTY_API_KEY: ${{ secrets.PAGERDUTY_API_KEY }}
          SCHEDULE_ID: P92FHSJ
        with:
          script: |
            const { notifyWhenReadyToMerge } = require('./scripts/release_ci/index.js');
            const {
                SLACK_THREADS_STORE_ID,
                SLACK_CHANNEL_ID,
                APIFY_API_TOKEN,
                GITHUB_TOKEN,
                SLACK_API_TOKEN,
                PAGERDUTY_API_KEY,
                SCHEDULE_ID,
            } = process.env;

            await notifyWhenReadyToMerge({
                github,
                core,
                pullNumber: context.payload.pull_request.number,
                apifyApiToken: APIFY_API_TOKEN,
                pagerDutyApiKey: PAGERDUTY_API_KEY,
                pagerDutyScheduleId: SCHEDULE_ID,
                privilegedGithubToken: GITHUB_TOKEN,
                slackApiToken: SLACK_API_TOKEN,
                slackThreadsStoreId: SLACK_THREADS_STORE_ID,
                slackChannelId: SLACK_CHANNEL_ID,
                repo: context.repo.repo,
                repoOwner: context.repo.owner,
            });

