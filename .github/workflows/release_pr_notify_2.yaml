name: notify release PR

#
# Reusable workflow that takes care of the release PR, based on the `notify_committers` job of apify-core's
# release_staging.yaml. Call it from a `pull_request` workflow (opened, reopened, synchronize) on the release PRs.
#
# Because it is a separate workflow, it first waits for the staging release workflow of the PR (see `stagingWorkflowFile`)
# to finish, and takes the results of the deploy and tests from its jobs. Then it:
#  - requests reviews from the changelog authors (and the deploy duty and the QA team), and removes the CODEOWNERS,
#  - sends an update to Slack: "release ready for testing" tagging all commit authors, a warning when the deploy
#    failed, or an update of the existing thread. The thread is remembered in an Apify key-value store.
#
# Use a `concurrency` group with `cancel-in-progress` in the caller, so that a new commit in the release PR cancels the
# waiting for the previous one.
#
name: notify release PR 2

on:
  workflow_call:
    inputs:
      stagingWorkflowFile:
        description: File name of the workflow that deploys the release PR to staging, e.g. release_staging.yaml
        required: true
        type: string
      stagingChecks:
        description: >
          JSON array of the steps of the staging release to report in Slack. Each item has a `label`, a `jobPrefix`
          (name of the job in the staging workflow, nested workflow jobs are matched by the `<jobPrefix> /` prefix)
          and a `kind`: `deploy` (the release is considered deployed when all of them succeed) or `test`.
        required: false
        type: string
        default: >-
          [
            {"label": "Build", "jobPrefix": "build", "kind": "deploy"},
            {"label": "Deploy", "jobPrefix": "deploy", "kind": "deploy"},
            {"label": "Integration tests", "jobPrefix": "integration_tests", "kind": "test"}
          ]
      stagingTimeoutMinutes:
        description: How long to wait for the staging workflow to finish
        required: false
        type: number
        default: 90
      changelogScopes:
        description: Scopes of the changelog, in the same format as in the open_pull_request workflow
        required: true
        type: string
      slackChannelId:
        description: Slack channel for the release updates (default is #engineering-releases)
        required: false
        type: string
        default: C0AGAN0JM39
      slackContextLinks:
        description: 'JSON array of extra links (`{"label": "...", "url": "..."}`) in the "release ready" Slack message'
        required: false
        type: string
        default: '[]'
      slackButtons:
        description: 'JSON array of extra buttons (`{"label": "...", "url": "..."}`) in the "release ready" Slack message'
        required: false
        type: string
        default: '[]'
      slackThreadsStoreId:
        description: >
          Apify key-value store remembering the Slack threads of the release PRs. The store is under the apify-platform
          account and can be shared by repositories as long as they use a different `slackThreadRecordKeyPrefix`.
        required: false
        type: string
        default: 3EfC58GUAEGruKLoY
      slackThreadRecordKeyPrefix:
        description: >
          Prefix of the keys in the key-value store (the key is the prefix followed by the PR number). Has to be unique
          for the repository when the store is shared, and the same in all release PR workflows of the repository.
        required: false
        type: string
        default: ''
      deployDutyScheduleId:
        description: PagerDuty schedule of the deploy duty, who is also requested to review the release PR
        required: false
        type: string
        default: P92FHSJ
      onCallDutyScheduleId:
        description: PagerDuty schedule of the on-call duty
        required: false
        type: string
        default: PFPGIK6
      qaDutyScheduleId:
        description: PagerDuty schedule of the QA duty
        required: false
        type: string
        default: P9KIL1S
      qaTeamSlug:
        description: GitHub team of QA, requested to review the release PR unless a member has already reviewed it. Empty to disable.
        required: false
        type: string
        default: qa
      qaSlackGroupId:
        description: Slack group of QA tagged in the messages. Empty to disable.
        required: false
        type: string
        default: S06U4RX8K4N
      releaseAppId:
        description: ID of the GitHub App (the `RELEASE_APP_ID` variable) with access to the organization members and teams
        required: true
        type: string
      workflowsRef:
        description: >
          Branch or tag of apify/workflows the helper scripts are checked out from. It should be the same ref as the
          one the workflow is referenced with (`uses: apify/workflows/...@<ref>`).
        required: false
        type: string
        default: main
    secrets:
      slackToken:
        description: Slack bot token
        required: true
      apifyApiToken:
        description: Apify API token with access to the key-value store of the Slack threads
        required: true
      pagerDutyApiKey:
        description: PagerDuty API key to look up the duties
        required: true
      releaseAppPrivateKey:
        description: Private key of the GitHub App
        required: true

env:
  # Key-value store that we use to remember started Slack threads for pending releases. This allows us to avoid double
  # posting. The store is under the apify-platform account.
  # Tip: To quickly erase the thread ID from the store during testing, you can use the following command:
  # curl -X DELETE "https://api.apify.com/v2/key-value-stores/${SLACK_THREADS_STORE_ID}/records/${SLACK_THREAD_RECORD_KEY}?token=${APIFY_TOKEN}"
  SLACK_THREADS_STORE_ID: ${{ inputs.slackThreadsStoreId }}
  SLACK_THREAD_RECORD_KEY: ${{ inputs.slackThreadRecordKeyPrefix }}${{ github.event.number }} # PR number
  APIFY_API_TOKEN: ${{ secrets.apifyApiToken }}

jobs:
  # Waits for the staging workflow of the release PR, and evaluates the results of the steps of the release.
  wait_for_staging_run:
    name: Wait for the staging release
    # Ignoring everything but release PRs (e.g. when the caller is run manually).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04-arm64
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.wait.outputs.skip }}
      checks: ${{ steps.wait.outputs.checks }}
      jobs: ${{ steps.wait.outputs.jobs }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v6
        with:
          repository: apify/workflows
          ref: ${{ inputs.workflowsRef }}
          path: .workflows
          sparse-checkout: 'scripts'

      - name: Wait for the staging release workflow
        id: wait
        uses: actions/github-script@v8.0.0
        env:
          STAGING_WORKFLOW_FILE: ${{ inputs.stagingWorkflowFile }}
          STAGING_CHECKS: ${{ inputs.stagingChecks }}
          STAGING_TIMEOUT_MINUTES: ${{ inputs.stagingTimeoutMinutes }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { waitForStagingRun, getCheckResult } = require('./.workflows/scripts/release_ci/index.js');

            const run = await waitForStagingRun({
                github,
                core,
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflowFile: process.env.STAGING_WORKFLOW_FILE,
                headSha: process.env.PR_HEAD_SHA,
                timeoutMinutes: Number(process.env.STAGING_TIMEOUT_MINUTES),
            });

            core.info(`Staging release finished: ${run.runUrl} (${run.conclusion})`);

            // A cancelled run (for example replaced by a newer commit) is not a result worth reporting.
            if (run.conclusion === 'cancelled') {
                core.notice('The staging release was cancelled, not sending any notification.');
                core.setOutput('skip', 'true');
                return;
            }

            const checks = JSON.parse(process.env.STAGING_CHECKS).map((check) => ({
                ...check,
                result: getCheckResult(run.jobs, check.jobPrefix),
            }));

            core.setOutput('skip', 'false');
            core.setOutput('checks', JSON.stringify(checks));
            core.setOutput('jobs', JSON.stringify({ jobs: run.jobs }));

  notify_committers:
    runs-on: ubuntu-22.04-arm64
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs: wait_for_staging_run
    # Not sending anything for a cancelled staging release.
    if: needs.wait_for_staging_run.outputs.skip == 'false'
    steps:
      - name: checkout-repo # To get the scripts, e.g. pending_release_slack_updates.js
        uses: actions/checkout@v6
        with:
          repository: apify/workflows
          ref: ${{ inputs.workflowsRef }}
          path: .workflows
          sparse-checkout: 'scripts'

      - uses: actions/create-github-app-token@v3
        id: generate-privileged-token
        with:
          app-id: ${{ inputs.releaseAppId }}
          private-key: ${{ secrets.releaseAppPrivateKey }}

      - name: Fetch changelog authors
        id: fetch-changelog-authors
        uses: apify/release-pr-action@v3.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          slack-token: ${{ secrets.slackToken }}
          changelog-method: commits_compare
          changelog-scopes: ${{ inputs.changelogScopes }}
          fetch-author-slack-ids: true
          github-org-token: ${{ steps.generate-privileged-token.outputs.token }}
          release-name-method: 'tag'

      - name: Fetch Slack thread ID
        id: fetch-slack-thread-id
        uses: actions/github-script@v8.0.0
        continue-on-error: true
        with:
          script: |
            const { fetchSlackReleaseThreadId } = require('./.workflows/scripts/release_ci/index.js');
            const threadId = await fetchSlackReleaseThreadId({
                apifyApiToken: process.env.APIFY_API_TOKEN,
                apifyStoreId: process.env.SLACK_THREADS_STORE_ID,
                apifyRecordKey: process.env.SLACK_THREAD_RECORD_KEY,
            });

            if (!threadId) {
                core.warning("Failed to fetch Slack thread ID which is usually fine (it probably just doesn't exist yet)");

                process.exit(0);
            }

            core.setOutput('slack-thread-id', threadId);

      - name: fetch-duty-slack-ids
        id: fetch-duty-slack-ids
        uses: actions/github-script@v8.0.0
        continue-on-error: true
        env:
          PAGERDUTY_API_KEY: ${{ secrets.pagerDutyApiKey }}
          DEPLOY_DUTY_SCHEDULE_ID: ${{ inputs.deployDutyScheduleId }}
          ON_CALL_DUTY_SCHEDULE_ID: ${{ inputs.onCallDutyScheduleId }}
          QA_DUTY_SCHEDULE_ID: ${{ inputs.qaDutyScheduleId }}
          SLACK_API_TOKEN: ${{ secrets.slackToken }}
          GITHUB_TOKEN: ${{ steps.generate-privileged-token.outputs.token }}
        with:
          script: |
            const { fetchPagerDutyScheduleUser } = require('./.workflows/scripts/release_ci/index.js');
            const { PAGERDUTY_API_KEY, DEPLOY_DUTY_SCHEDULE_ID, ON_CALL_DUTY_SCHEDULE_ID, QA_DUTY_SCHEDULE_ID, SLACK_API_TOKEN, GITHUB_TOKEN } = process.env;

            const commonOpts = {
                core,
                pagerDutyApiKey: PAGERDUTY_API_KEY,
                slackApiToken: SLACK_API_TOKEN,
                githubToken: GITHUB_TOKEN,
            };

            // allSettled (not all) so that one schedule's lookup failing does not drop the other duty tags.
            // Schedules that are not configured are not looked up.
            const scheduleIds = [DEPLOY_DUTY_SCHEDULE_ID, ON_CALL_DUTY_SCHEDULE_ID, QA_DUTY_SCHEDULE_ID];
            const [deployDuty, onCallDuty, qaDuty] = (await Promise.allSettled(
                scheduleIds.map((scheduleId) => (scheduleId ? fetchPagerDutyScheduleUser({ ...commonOpts, scheduleId }) : null)),
            )).map((result, index) => {
                if (result.status === 'fulfilled') return result.value;
                core.warning(`PagerDuty duty lookup failed for schedule ${scheduleIds[index]}: ${String(result.reason)}`);
                return null;
            });

            if (deployDuty) {
                core.setOutput('deploy-duty-slack-id', deployDuty.slackId);
                core.setOutput('deploy-duty-github-login', deployDuty.githubLogin);
            }

            if (onCallDuty) {
                core.setOutput('on-call-duty-slack-id', onCallDuty.slackId);
            }

            if (qaDuty) {
                core.setOutput('qa-duty-slack-id', qaDuty.slackId);
            }

      - name: Unassign CODEOWNERS
        uses: actions/github-script@v8.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_NUMBER: ${{ github.event.number }}
          CHANGELOG_AUTHORS: ${{ steps.fetch-changelog-authors.outputs.github-changelog-authors }}
          DEPLOY_DUTY_LOGIN: ${{ steps.fetch-duty-slack-ids.outputs.deploy-duty-github-login }}
        with:
          # If a team is mentioned in the requested reviewers and we try to list it
          # this step will fail on invalid permissions.
          # -> Need to use a token with permissions to view organization teams.
          github-token: ${{ steps.generate-privileged-token.outputs.token }}
          script: |
            const { fetchCodeOwnerLogins } = require('./.workflows/scripts/release_ci/index.js');

            const [codeowners, submittedReviews] = await Promise.all([
                fetchCodeOwnerLogins({
                    // This token is only used to fetch the file from the githubusercontent url.
                    // It does not need to be privileged.
                    githubToken: process.env.GITHUB_TOKEN,
                    pullNumber: +process.env.PULL_NUMBER,
                }),
                github.paginate(github.rest.pulls.listReviews, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.number,
                }),
            ]);

            // Do not remove reviewers, that have already submitted a review.
            const submittedReviewsLogins = new Set(
                submittedReviews
                    .map((review) => review.user?.login)
                    .filter(Boolean),
            );

            // Do not remove the review request from changelog authors,
            // i.e. from people, that have a commit in the release.
            const changelogAuthors = new Set(
                JSON.parse(process.env.CHANGELOG_AUTHORS || '[]')
                    .map((author) => author.login),
            );

            const reviewersToRemove = Array.from(codeowners).filter((login) => {
                return (
                    !changelogAuthors.has(login) &&
                    !submittedReviewsLogins.has(login) &&

                    // Also, do not remove the review request
                    // from the current deploy duty.
                    login !== process.env.DEPLOY_DUTY_LOGIN
                );
            });

            if (reviewersToRemove.length === 0) {
                core.info('no reviewers found to be removed, exiting...');

                process.exit(0);
            }

            core.info(`removing review requests from codeowners: [${reviewersToRemove.join(', ')}]`);

            // The codeowners should have already seen all of the changes
            // in the original PRs. No need to request reviews from them in the release PR.
            await github.rest.pulls.removeRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.number,
                reviewers: reviewersToRemove,
            });

      - name: Request changelog authors, QA and deploy duty as reviewers
        uses: actions/github-script@v8.0.0
        continue-on-error: true
        env:
          CHANGELOG_AUTHORS: ${{ steps.fetch-changelog-authors.outputs.github-changelog-authors }}
          DEPLOY_DUTY_LOGIN: ${{ steps.fetch-duty-slack-ids.outputs.deploy-duty-github-login }}
          QA_TEAM_SLUG: ${{ inputs.qaTeamSlug }}
        with:
          # In order to assign teams as reviewers, we need an access token that has access to the organization.
          # The default actions github.token does not have that.
          github-token: ${{ steps.generate-privileged-token.outputs.token }}
          script: |
            const qaTeamSlug = process.env.QA_TEAM_SLUG;

            const reviewers = JSON.parse(process.env.CHANGELOG_AUTHORS || '[]')
                // Only take logins of the authors, that are in the `apify` organization.
                // We can determine that by whether their `slackId` was found.
                .filter((author) => typeof author.slackId !== 'undefined')
                .map(({ login }) => login)
                // Drop falsy logins so one bad entry can't 422 the whole requestReviewers call.
                .filter(Boolean);

            if (process.env.DEPLOY_DUTY_LOGIN) {
                reviewers.push(process.env.DEPLOY_DUTY_LOGIN);
            }

            const [submittedReviews, qaTeamMembers, fullTimeline, commitsInPR] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.number,
                }),
                qaTeamSlug
                    ? github.paginate(github.rest.teams.listMembersInOrg, {
                          org: context.repo.owner,
                          team_slug: qaTeamSlug,
                      })
                    : [],
                github.paginate(github.rest.issues.listEventsForTimeline, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.number,
                }),
                github.paginate(github.rest.pulls.listCommits, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.number,
                }),
            ]);
            const timeline = fullTimeline.filter((event) => ['review_requested', 'review_request_removed', 'committed'].includes(event.event));

            // We don't want to request reviews again if the reviewer was manually removed,
            // but only if they were not added again afterwards, or they didn't make a commit after being removed.
            // The pull request timeline includes events like "review requested", "review request removed" and "committed".

            // The "committed" event does not include the GitHub login of the committer, only their email, which might not be linked to a GitHub account.
            // We can get the login from the list of commits in the pull request, which includes the author login.
            for (const event of timeline) {
                if (event.event === 'committed') {
                    const commit = commitsInPR.find((commit) => commit.sha === event.sha);
                    if (commit) {
                        event.author = event.author || {};
                        event.author.login = commit.author?.login;
                    }
                }
                // Backfill created_at for events that don't have it, using the author's date if available.
                event.created_at = event.created_at || event.author?.date;
            }

            // Sort timeline by created_at in descending order so that the last event is first (it's easier to work with).
            timeline.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // Find reviewers that were removed and not added again afterwards, or did not make a commit after being removed.
            const removedReviewersLogins = new Set(reviewers.filter((reviewer) => {
                // Find the last event in the timeline where the reviewer was removed, added, or made a commit.
                const lastRemovedEvent = timeline.find((event) => event.event === 'review_request_removed' && event.requested_reviewer?.login === reviewer);
                const lastAddedEvent = timeline.find((event) => event.event === 'review_requested' && event.requested_reviewer?.login === reviewer);
                const lastCommitEvent = timeline.find((event) => event.event === 'committed' && event.author?.login === reviewer);

                return lastRemovedEvent && (!lastAddedEvent || lastAddedEvent.created_at < lastRemovedEvent.created_at) && (!lastCommitEvent || lastCommitEvent.created_at < lastRemovedEvent.created_at);
            }));

            // Logins of reviewers, which should not be re-requested to review the PR.
            // This would invalidate their previous review.
            const submittedReviewsLogins = new Set(
                submittedReviews
                    .map((review) => review.user?.login)
                    .filter(Boolean),
            );

            // Check if someone from the QA team has submitted their review.
            // Request the team to review the release PR otherwise.
            // At least one of the members of the team must approve the PR.
            const teamReviewers = [];
            if (qaTeamSlug && !qaTeamMembers.some((member) => submittedReviewsLogins.has(member.login))) {
                teamReviewers.push(qaTeamSlug);
            }

            const requestReviewers = (/** @type {string[]} */ teams) => github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.number,

                reviewers: reviewers.filter((reviewer) => {
                    // The reviewer hasn't already submitted a review
                    // either approving the PR or not, does not matter.
                    // -> They should not get re-requested.
                    if (submittedReviewsLogins.has(reviewer)) {
                        return false;
                    }

                    if (removedReviewersLogins.has(reviewer)) {
                        return false;
                    }

                    const { user, assignee } = context.payload.pull_request;

                    // Filter out assignees and PR creators.
                    // It should never happen in the release PR,
                    // but it is useful for testing on different PRs.
                    return (!user || reviewer !== user.login) &&
                        (!assignee || reviewer !== assignee.login);
                }),
                team_reviewers: teams,
            });

            try {
                await requestReviewers(teamReviewers);
            } catch (error) {
                if (teamReviewers.length === 0) throw error;

                // The team can only be requested when it has access to the repository. Do not lose the other reviewers then.
                core.warning(`Requesting reviews with the team "${qaTeamSlug}" failed (${error.message}), retrying without it.`);
                await requestReviewers([]);
            }

      - name: create-slack-update
        id: create-slack-update
        uses: actions/github-script@v8.0.0
        env:
          # It is insecure to inject PR title directly into the code, hence passing it as environment variables.
          # See why: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_CHANGELOG_AUTHORS: ${{ steps.fetch-changelog-authors.outputs.github-changelog-authors }}
          STAGING_CHECKS: ${{ needs.wait_for_staging_run.outputs.checks }}
          ACTIONS_JOBS: ${{ needs.wait_for_staging_run.outputs.jobs }}
          SLACK_THREAD_ID: ${{ steps.fetch-slack-thread-id.outputs.slack-thread-id }}
          DEPLOY_DUTY_SLACK_ID: ${{ steps.fetch-duty-slack-ids.outputs.deploy-duty-slack-id }}
          ON_CALL_DUTY_SLACK_ID: ${{ steps.fetch-duty-slack-ids.outputs.on-call-duty-slack-id }}
          QA_DUTY_SLACK_ID: ${{ steps.fetch-duty-slack-ids.outputs.qa-duty-slack-id }}
          QA_SLACK_GROUP_ID: ${{ inputs.qaSlackGroupId }}
          SLACK_CONTEXT_LINKS: ${{ inputs.slackContextLinks }}
          SLACK_BUTTONS: ${{ inputs.slackButtons }}
        with:
          script: |
            const { createSlackUpdate } = require('./.workflows/scripts/release_ci/index.js');

            const checks = JSON.parse(process.env.STAGING_CHECKS);

            const { message, shouldStoreThreadId } = createSlackUpdate({
              deployChecks: checks.filter((check) => check.kind === 'deploy'),
              testChecks: checks.filter((check) => check.kind !== 'deploy'),
              slackThreadId: process.env.SLACK_THREAD_ID,
              prTitle: process.env.PR_TITLE,
              prUrl: process.env.PR_URL,
              changelogAuthors: JSON.parse(process.env.GITHUB_CHANGELOG_AUTHORS || '[]'),
              jobs: JSON.parse(process.env.ACTIONS_JOBS || '{"jobs": []}'),
              deployDutySlackId: process.env.DEPLOY_DUTY_SLACK_ID,
              onCallDutySlackId: process.env.ON_CALL_DUTY_SLACK_ID,
              qaDutySlackId: process.env.QA_DUTY_SLACK_ID,
              qaSlackGroupId: process.env.QA_SLACK_GROUP_ID,
              contextLinks: JSON.parse(process.env.SLACK_CONTEXT_LINKS),
              buttons: JSON.parse(process.env.SLACK_BUTTONS),
            });

            // Log the full message in case we need to debug it.
            core.startGroup('Created message');
            core.info(message);
            core.endGroup();

            core.setOutput('message', message);
            core.setOutput('should-store-thread-id', shouldStoreThreadId);

      - name: send-slack-message
        id: send-slack-message
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slackToken }}
        with:
          channel-id: ${{ inputs.slackChannelId }}
          payload: ${{ steps.create-slack-update.outputs.message }}

      - name: store-slack-thread-id
        if: steps.create-slack-update.outputs.should-store-thread-id == 'true'
        env:
          SLACK_THREAD_ID: ${{ steps.send-slack-message.outputs.ts }}
        run: |
          curl -s --retry 5 -X POST "https://api.apify.com/v2/key-value-stores/${SLACK_THREADS_STORE_ID}/records/${SLACK_THREAD_RECORD_KEY}" \
            -H "Content-Type: text/plain" \
            -H "Authorization: Bearer ${APIFY_API_TOKEN}" \
            --data "${SLACK_THREAD_ID}"
