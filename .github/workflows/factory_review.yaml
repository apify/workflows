name: apify-factory review (AI review, and auto-approval)

# Calls the apify-factory review and auto-approval pipeline (apify/ai-developer, wired up in
# apify/workflows). A pull request is reviewed when apify-factory is requested; with the
# repository's `factory_auto_review` custom property set to true, also every ready pull request when
# it opens and after every push that changes its content. Approvals additionally need the
# repository's `factory_auto_approve` custom property set to true.
on:
  # Taken from the default branch, never from the pull request, so a pull request cannot rewrite
  # its own review pipeline. Pull request code is never checked out or executed. `edited` delivers
  # base changes, without which pull requests on another base are not approved.
  pull_request_target:
    types:
      - opened
      - reopened
      - review_requested
      - review_request_removed
      - converted_to_draft
      - ready_for_review
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: write
  # Proves to the core Actor that this run hands a review to a sandbox.
  id-token: write

# A push cancels the run in progress, and only the newest waiting run is kept, so an event that
# starts no job (a request or removal naming another reviewer) gets its own group, as does
# removing the bot's request. Never name a group `factory-review-<number>` alone: it deadlocks.
concurrency:
  group: >-
    factory-review-${{ github.event.pull_request.number }}-${{
      startsWith(github.event.action, 'review_request')
        && github.event.requested_reviewer.login != 'apify-factory' && github.run_id
      || github.event.action == 'review_request_removed' && 'withdraw'
      || 'events' }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  factory-review:
    uses: apify/workflows/.github/workflows/factory_review.yaml@0a1eaf3d3b67be2e8c15b2fc989168721809c8e2 # v1.4.1
    # The three secrets the pipeline declares, instead of every secret this repository can read.
    secrets:
      APIFY_FACTORY_GITHUB_TOKEN: ${{ secrets.APIFY_FACTORY_GITHUB_TOKEN }}
      ANTHROPIC_API_KEY_APIFY_FACTORY_REVIEW: ${{ secrets.ANTHROPIC_API_KEY_APIFY_FACTORY_REVIEW }}
      APIFY_FACTORY_CALLBACK_TOKEN: ${{ secrets.APIFY_FACTORY_CALLBACK_TOKEN }}
        required: true
      ANTHROPIC_API_KEY_APIFY_FACTORY_REVIEW:
        required: true
      APIFY_FACTORY_CALLBACK_TOKEN:
        description: Apify token that reaches the factory's core Actor. With the organization variable FACTORY_PUBLIC_URL, each review becomes a run on the factory dashboard.
        required: false

jobs:
  # Runs on every pull request event but the request itself, by design: it is the only way to tell
  # whether apify-factory has an approval at stake, is still requested, or reviews this repository
  # on its own, and it costs three API reads. It reads the requested reviewers live rather than from
  # the payload, which is stale when this run took the place of a newer event's waiting run.
  approval-lookup:
    name: Look up the review state
    if: >-
      github.event.action != 'review_requested'
      && github.event.action != 'review_request_removed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      requested: ${{ steps.check.outputs.requested }}
      auto-review: ${{ steps.check.outputs.auto_review }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A dismissed approval is state DISMISSED, so it stops counting on its own.
          ids=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.user.login == "apify-factory" and .state == "APPROVED") | .id')
          echo "approved=$([ -n "$ids" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          requested=$(gh api "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            --jq '[.users[].login] | index("apify-factory") != null')
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          # The repository's factory_auto_review custom property: review every ready pull request.
          auto=$(gh api "repos/$REPO/properties/values" \
            --jq '[.[] | select(.property_name == "factory_auto_review") | .value][0] == "true"' \
            2>/dev/null) || auto=false
          echo "auto_review=$auto" >> "$GITHUB_OUTPUT"

  review:
    name: AI review
    needs: approval-lookup
    # A review request names one reviewer, so a request for anybody else is not this pipeline's
    # business. On the other events the job runs when the bot is still requested (except on
    # `opened`, whose own review_requested event reviews it), when an approval
    # is at stake, or when the repository reviews every ready pull request on its own. A failed
    # lookup answers neither "false", so it runs the job: it must not be the reason a stale
    # approval survives a push.
    if: >-
      !cancelled() && (
        github.event.requested_reviewer.login == 'apify-factory'
        || (
          github.event.action != 'review_requested'
          && github.event.action != 'review_request_removed'
          && (
            (needs.approval-lookup.outputs.requested != 'false' && github.event.action != 'opened')
            || needs.approval-lookup.outputs.approved != 'false'
            || (
              needs.approval-lookup.outputs.auto-review == 'true'
              && !github.event.pull_request.draft
              && contains(fromJSON('["opened","reopened","ready_for_review","synchronize"]'), github.event.action)
            )
          )
        )
      )
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    # Never cancel a running review: the action posts nothing from a cancelled run, which would leave
    # the request pending with no review. GitHub keeps one waiting run per group and replaces it with
    # a newer one. The group differs from the stub's own, which would otherwise wait on this job.
    concurrency:
      group: factory-review-job-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out apify/ai-developer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: apify/ai-developer
          ref: ${{ inputs.ai-developer-ref }}
          token: ${{ secrets.APIFY_FACTORY_GITHUB_TOKEN }}
          path: .ai-developer
          persist-credentials: false

      # The action checks the repository under review out itself, at its base branch.
      - name: Review, and approve when nothing needs a human
        uses: ./.ai-developer/actions/auto-approve
        with:
          pr-number: ${{ github.event.pull_request.number }}
          trigger: ${{ github.event.action }}
          actor: ${{ github.actor }}
          github-token: ${{ github.token }}
          factory-github-token: ${{ secrets.APIFY_FACTORY_GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY_APIFY_FACTORY_REVIEW }}
          policy: ${{ inputs.policy }}
          callback-token: ${{ secrets.APIFY_FACTORY_CALLBACK_TOKEN }}
          factory-public-url: ${{ vars.FACTORY_PUBLIC_URL }}
