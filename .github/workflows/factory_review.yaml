name: apify-factory review (AI review, and auto-approval)

# The review and auto-approval pipeline of apify/ai-developer, called from a short
# `factory_review.yaml` stub in each repository that opts in. The stub must live in the repository
# itself: only a workflow GitHub runs there receives every push, and a push that changes the code
# has to withdraw the bot's approval.
#
# The pipeline lives in apify/ai-developer, which is internal, and a public repository cannot call
# an internal workflow or action. So this public workflow holds only the job wiring: its review job
# checks ai-developer out with the bot's token and runs the action from that checkout.
#
# It runs when @apify-factory is requested as a reviewer, and also when the request is withdrawn,
# the PR goes back to draft, or a push changes the code, to withdraw the approval with it. In a
# repository whose factory_auto_review custom property is true, it also reviews a ready pull
# request when it opens, reopens, is marked ready or receives a push. Only apify-factory's own
# approvals are ever withdrawn.
#
# Submitting a review clears the review request, so on a push the payload alone cannot say whether
# there is an approval at stake. The lookup job answers that in one API call, so the review job —
# which checks out, installs and can call two models — starts only when it has something to do.

on:
  workflow_call:
    inputs:
      policy:
        description: Optional JSON policy overrides for the calling repository (see the ai-developer auto-approve README).
        type: string
        required: false
        default: ""
      runs-on:
        description: Runner label for the review job.
        type: string
        required: false
        default: ubuntu-latest
      ai-developer-ref:
        description: Ref of apify/ai-developer to run the pipeline from.
        type: string
        required: false
        default: main
    secrets:
      APIFY_FACTORY_GITHUB_TOKEN:
        required: true
      ANTHROPIC_API_KEY_APIFY_FACTORY_REVIEW:
        required: true
      APIFY_FACTORY_CALLBACK_TOKEN:
        description: Apify token that reaches the factory's core Actor. With the organization variable FACTORY_PUBLIC_URL, each review becomes a run on the factory dashboard.
        required: false

jobs:
  # Runs on every pull request event but the request itself, by design: it is the only way to tell
  # whether apify-factory has an approval at stake, is still requested, or reviews this repository
  # on its own, and it costs three API reads. It reads the requested reviewers live rather than from
  # the payload, which is stale when this run took the place of a newer event's waiting run.
  approval-lookup:
    name: Look up an existing approval
    if: >-
      github.event.action != 'review_requested'
      && github.event.action != 'review_request_removed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      requested: ${{ steps.check.outputs.requested }}
      auto-review: ${{ steps.check.outputs.auto_review }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A dismissed approval is state DISMISSED, so it stops counting on its own.
          ids=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.user.login == "apify-factory" and .state == "APPROVED") | .id')
          echo "approved=$([ -n "$ids" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          requested=$(gh api "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            --jq '[.users[].login] | index("apify-factory") != null')
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          # The repository's factory_auto_review custom property: review every ready pull request.
          auto=$(gh api "repos/$REPO/properties/values" \
            --jq '[.[] | select(.property_name == "factory_auto_review") | .value][0] == "true"' \
            || echo false)
          echo "auto_review=$auto" >> "$GITHUB_OUTPUT"

  review:
    name: AI review
    needs: approval-lookup
    # A review request names one reviewer, so a request for anybody else is not this pipeline's
    # business. On the other events the job runs when the bot is still requested, when an approval
    # is at stake, or when the repository reviews every ready pull request on its own. A failed
    # lookup answers neither "false", so it runs the job: it must not be the reason a stale
    # approval survives a push.
    if: >-
      !cancelled() && (
        github.event.requested_reviewer.login == 'apify-factory'
        || (
          github.event.action != 'review_requested'
          && github.event.action != 'review_request_removed'
          && (
            needs.approval-lookup.outputs.requested != 'false'
            || needs.approval-lookup.outputs.approved != 'false'
            || (
              needs.approval-lookup.outputs.auto-review == 'true'
              && !github.event.pull_request.draft
              && contains(fromJSON('["opened","reopened","ready_for_review","synchronize"]'), github.event.action)
            )
          )
        )
      )
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      # Proves to the factory's core Actor that this run hands a review to a sandbox.
      id-token: write
    # Queue rather than cancel: the action posts nothing from a cancelled run, so cancelling one mid
    # review would leave the request pending with no review and no event left to re-trigger it.
    concurrency:
      group: factory-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out apify/ai-developer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: apify/ai-developer
          ref: ${{ inputs.ai-developer-ref }}
          token: ${{ secrets.APIFY_FACTORY_GITHUB_TOKEN }}
          path: .ai-developer
          persist-credentials: false

      # The action checks the repository under review out itself, at its base branch.
      - name: Review, and approve when nothing needs a human
        uses: ./.ai-developer/actions/auto-approve
        with:
          pr-number: ${{ github.event.pull_request.number }}
          trigger: ${{ github.event.action }}
          actor: ${{ github.actor }}
          github-token: ${{ github.token }}
          factory-github-token: ${{ secrets.APIFY_FACTORY_GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY_APIFY_FACTORY_REVIEW }}
          policy: ${{ inputs.policy }}
          callback-token: ${{ secrets.APIFY_FACTORY_CALLBACK_TOKEN }}
          factory-public-url: ${{ vars.FACTORY_PUBLIC_URL }}
