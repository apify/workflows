name: sync branches

on:
  workflow_call:
    inputs:
      slackChannelId:
        description: Slack Channel ID
        required: true
        type: string
      revision:
        description: Tag given to container image
        required: true
        type: string
      baseBranch:
        description: Branch that will be synchronized with current branch
        required: false
        type: string
        default: develop
      actorOverride:
        description: Override the author of event
        required: false
        type: string
      githubAppId:
        description: ID or client ID of the GitHub App used to open and merge the pull request
        required: true
        type: string

    secrets:
      slackToken:
        description: Slack API token
        required: true
      githubAppPrivateKey:
        description: Private key of the GitHub App used to open and merge the pull request
        required: true

jobs:
  pull_request:
    runs-on: ubuntu-22.04-arm64
    steps:
      # The app must be a bypass actor for the base branch protection: the pull request is merged
      # without approval and with a merge commit. The workflows permission is required when the
      # synced changes include files in .github/workflows.
      - name: create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.githubAppId }}
          private-key: ${{ secrets.githubAppPrivateKey }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: open and merge pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            let headBranch = '';
            const eventName = process.env.GITHUB_EVENT_NAME;
            if (eventName === 'pull_request') {
                headBranch = process.env.GITHUB_BASE_REF;
            } else if (eventName === 'push' || eventName === 'workflow_dispatch') {
                headBranch = process.env.GITHUB_REF_NAME;
            } else {
                throw new Error(`Don't know how to handle event name: ${eventName}`);
            }

            // Create pull request from headBranch to baseBranch (typically `master` to `develop`)
            const createResp = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: headBranch,
                base: '${{ inputs.baseBranch }}',
                title: `chore: backport changes from ${headBranch} to ${{ inputs.baseBranch }} [ignore]`,
            });

            const pullRequestNumber = createResp.data.number;

            // Merge pull request
            await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequestNumber,
            });

      - name: report failure to slack
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.slackToken }}
          payload: |
            {
              "channel": "${{ inputs.slackChannelId }}",
              "text": ":red_circle: *${{ github.repository }} syncing ${{ github.base_ref }} to ${{ inputs.baseBranch }}: ${{ job.status }}*",
              "attachments": [
                {
                  "color": "#ff0000",
                  "blocks": [
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Author:* ${{ inputs.actorOverride || github.actor }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Revision:* ${{ inputs.revision }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Triggered by:* ${{ github.event_name }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
