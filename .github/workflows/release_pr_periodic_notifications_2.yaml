name: Notify about release PR changes 2

# This job finds the current release PR (or PRs) and notifies
# the users, which have not yet submitted their review.
#
# The notification is sent to the #engineering-releases channel
# as a reply to the release message thread.
#
# The following steps are performed by this job:
#   1) lookup release PRs (opened PRs to master with branch name prefixed with `release/`),
#   2) get the reviewers of the release PR, which have not submitted their review yet,
#   3) lookup their emails via the Github API -> with that lookup their Slack ID,
#   4) find the thread ID of the Slack release message and reply with a message tagging the users from previous step.
#
# Reusable workflow, based on the one of apify-core. The caller runs it periodically (on schedule), this should ease the
# job of the current deploy duty, since they do not have to manually tag the unresponsive developers to approve the
# changes to release. The reminders are meant for working days, e.g. cron '0 11,13,15,16 * * MON-FRI' in Europe/Prague
# time zone. After 13:00 UTC the message also asks to consider reverting the changes.

on:
  workflow_call:
    inputs:
      slackChannelId:
        description: Slack channel with the release threads (default is #engineering-releases)
        required: false
        type: string
        default: C0AGAN0JM39
      slackThreadsStoreId:
        description: Apify key-value store remembering the Slack threads of the release PRs, see release_pr_notify_2
        required: false
        type: string
        default: 3EfC58GUAEGruKLoY
      slackThreadRecordKeyPrefix:
        description: Prefix of the keys in the key-value store, has to be the same as in release_pr_notify_2
        required: false
        type: string
        default: ''
      baseBranch:
        description: Branch the release PRs are opened to
        required: false
        type: string
        default: master
      releaseBranchPrefix:
        description: Prefix used for release branch names
        required: false
        type: string
        default: release
      workflowsRef:
        description: >
          Branch or tag of apify/workflows the helper scripts are checked out from. It should be the same ref as the
          one the workflow is referenced with (`uses: apify/workflows/...@<ref>`).
        required: false
        type: string
        default: main
      qaTeamSlug:
        description: GitHub team of QA, a pending review of the team is reminded by the QA Slack group
        required: false
        type: string
        default: qa
      qaSlackGroupId:
        description: Slack group of QA tagged in the messages. Empty to disable.
        required: false
        type: string
        default: S06U4RX8K4N
    secrets:
      slackToken:
        description: Slack bot token
        required: true
      apifyApiToken:
        description: Apify API token with access to the key-value store of the Slack threads
        required: true
      serviceAccountGithubToken:
        description: GitHub token with access to the organization members, to look up their emails
        required: true

jobs:
  notify:
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: checkout-repo
        uses: actions/checkout@v4
        with:
          repository: apify/workflows
          ref: ${{ inputs.workflowsRef }}
          path: .workflows
          # Make the checkout a small bit faster by only checking out the scripts directory.
          sparse-checkout: 'scripts'

      - name: Tag pending reviewers on Slack
        uses: actions/github-script@v8.0.0
        env:
          # Key-value store remembering the Slack threads of the pending releases, see release_pr_notify_2.yaml.
          SLACK_THREADS_STORE_ID: ${{ inputs.slackThreadsStoreId }}
          SLACK_THREAD_RECORD_KEY_PREFIX: ${{ inputs.slackThreadRecordKeyPrefix }}
          SLACK_CHANNEL_ID: ${{ inputs.slackChannelId }}
          BASE_BRANCH: ${{ inputs.baseBranch }}
          RELEASE_BRANCH_PREFIX: ${{ inputs.releaseBranchPrefix }}
          QA_TEAM_SLUG: ${{ inputs.qaTeamSlug }}
          QA_SLACK_GROUP_ID: ${{ inputs.qaSlackGroupId }}
          APIFY_API_TOKEN: ${{ secrets.apifyApiToken }}
          GITHUB_TOKEN: ${{ secrets.serviceAccountGithubToken }}
          SLACK_API_TOKEN: ${{ secrets.slackToken }}
        with:
          script: |
            const { notifyPendingReviewersInReleasePRs } = require('./.workflows/scripts/release_ci/index.js');
            const {
                SLACK_THREADS_STORE_ID,
                SLACK_CHANNEL_ID,
                APIFY_API_TOKEN,
                GITHUB_TOKEN,
                SLACK_API_TOKEN,
                SLACK_THREAD_RECORD_KEY_PREFIX,
                BASE_BRANCH,
                RELEASE_BRANCH_PREFIX,
                QA_TEAM_SLUG,
                QA_SLACK_GROUP_ID,
            } = process.env;

            await notifyPendingReviewersInReleasePRs({
                github,
                core,
                privilegedGithubToken: GITHUB_TOKEN,
                slackApiToken: SLACK_API_TOKEN,
                slackChannelId: SLACK_CHANNEL_ID,
                apifyApiToken: APIFY_API_TOKEN,
                apifyStoreId: SLACK_THREADS_STORE_ID,
                repoOwner: context.repo.owner,
                repo: context.repo.repo,
                baseBranch: BASE_BRANCH,
                releaseBranchPrefix: RELEASE_BRANCH_PREFIX,
                qaTeamSlug: QA_TEAM_SLUG || undefined,
                qaSlackGroupId: QA_SLACK_GROUP_ID || undefined,
                slackThreadRecordKeyPrefix: SLACK_THREAD_RECORD_KEY_PREFIX,
            });
