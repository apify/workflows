#
# Reusable workflow for creation of a new release branch, the first step of the release to staging and production.
# Successor of "create prod release", based on the workflow used in apify-core. Compared to it, it:
#  - skips days when we do not release (see scripts/should_release_today.js) for scheduled runs,
#  - posts a warning to Slack when a scheduled run cannot create the release.
#
# The caller defines the triggers, typically `workflow_dispatch` and a `schedule` (the workflow detects scheduled runs
# using `github.event_name`), see examples in the README.
#
# Once the release branch is created, we finish here and let separate workflows create the release PR and deploy to
# staging, as these need to run on the release branch.
#
name: create prod release 2

on:
  workflow_call:
    inputs:
      releaseBranchPrefix:
        description: Prefix used for release branch names
        required: false
        type: string
        default: release
      baseBranch:
        description: Branch treated as production base (patch releases are cut from here)
        required: false
        type: string
        default: master
      slackChannelId:
        description: Slack channel to post warnings about failed scheduled runs to (default is #engineering-releases)
        required: false
        type: string
        default: C0AGAN0JM39
      workflowsRef:
        description: >
          Branch or tag of apify/workflows the helper scripts are checked out from. It should be the same ref as the
          one the workflow is referenced with (`uses: apify/workflows/...@<ref>`).
        required: false
        type: string
        default: main
    secrets:
      serviceAccountGithubToken:
        description: Token used to create the release branch, so that the branch triggers the follow-up workflows
        required: true
      slackToken:
        description: Slack bot token used to post the warnings
        required: true

env:
  RELEASE_BRANCH_PREFIX: ${{ inputs.releaseBranchPrefix }}
  BASE_BRANCH: ${{ inputs.baseBranch }}
  CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  check_date:
    name: Check date if we should release today
    runs-on: ubuntu-22.04-arm64
    outputs:
      should_release_today: ${{ steps.check-date.outputs.should_release_today }}
    steps:
      - name: Check out should_release_today.js
        uses: actions/checkout@v4
        with:
          repository: apify/workflows
          ref: ${{ inputs.workflowsRef }}
          path: .workflows
          sparse-checkout: 'scripts'

      - name: Check date if we should release today
        id: check-date
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const { shouldReleaseToday } = require('./.workflows/scripts/should_release_today.js');
            core.setOutput('should_release_today', shouldReleaseToday(new Date()));

  check_no_pending_releases:
    name: Check if there are no pending releases
    needs: check_date
    if: ${{ needs.check_date.outputs.should_release_today == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Get pending release PR
        id: get-pending-release-pr
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const releasePRs = pullRequests.filter(pr => pr.head.ref.startsWith(process.env.RELEASE_BRANCH_PREFIX));

            if (releasePRs.length > 0) {
              core.setOutput('release_pr_found', 'true');
              core.setOutput('pr_name', releasePRs[0].title);
              core.setOutput('pr_url', releasePRs[0].html_url);
            } else {
              core.setOutput('release_pr_found', 'false');
            }

      - name: Send Slack message if a pending release PR is found
        if: |
          github.event_name == 'schedule' &&
          steps.get-pending-release-pr.outputs.release_pr_found == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slackToken }}
        with:
          channel-id: ${{ inputs.slackChannelId }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": ":warning:  Scheduled deploy to staging failed  :warning:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "There is already a pending release PR: *<${{ steps.get-pending-release-pr.outputs.pr_url }}|${{ steps.get-pending-release-pr.outputs.pr_name }}>*\n\nPlease finish the existing release first, and then start a new one manually."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "text": "This message was sent by the scheduled create_prod_release workflow.",
                      "type": "mrkdwn"
                    }
                  ]
                }
              ]
            }

      - name: Fail workflow if a pending release PR is found
        if: ${{ steps.get-pending-release-pr.outputs.release_pr_found == 'true' }}
        run: |
          echo "Failing workflow as there is a pending release"
          exit 1

  check_base_synced:
    name: Check if the current branch is in sync with the base branch
    needs: check_no_pending_releases
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Check if the current branch is in sync with the base branch
        id: check-base-synced
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = '${{ env.BASE_BRANCH }}'; // typically master
            const currentBranch = '${{ env.CURRENT_BRANCH }}'; // typically develop

            const { data: { status, behind_by } } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${baseBranch}...${currentBranch}`,
            });

            core.info(`Branch comparison status: ${status}`);
            core.info(`Branch comparison behind_by: ${behind_by}`);

            core.setOutput('is_base_synced', behind_by === 0 ? 'true' : 'false');

      - name: Send Slack message if current branch not in sync with base branch
        if: |
          github.event_name == 'schedule' &&
          steps.check-base-synced.outputs.is_base_synced == 'false'
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.slackToken }}
        with:
          channel-id: ${{ inputs.slackChannelId }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": ":warning:  Scheduled deploy to staging failed  :warning:"
                  }
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "`${{ env.CURRENT_BRANCH }}` is not in sync with `${{ env.BASE_BRANCH }}`.\n\nPlease manually merge the changes into `${{ env.CURRENT_BRANCH }}` first (do not squash!), and then start a new release manually. You can use the \"Merge Pull Request as Apify Service Account\" workflow to override branch protection."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "text": "This message was sent by the scheduled create_prod_release workflow.",
                      "type": "mrkdwn"
                    }
                  ]
                }
              ]
            }

      - name: Fail workflow if current branch not in sync with base branch
        if: ${{ steps.check-base-synced.outputs.is_base_synced == 'false' }}
        run: |
          echo "Failing workflow as the current branch is not in sync with '${{ env.BASE_BRANCH }}'."
          exit 1

  create_release_branch:
    name: Create release branch
    needs: check_base_synced
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Check out bump_release_name.js
        uses: actions/checkout@v4
        with:
          repository: apify/workflows
          ref: ${{ inputs.workflowsRef }}
          path: .workflows
          sparse-checkout: 'scripts'

      - name: Install Octokit
        run: npm install @octokit/rest@v19

      - name: Create release branch
        uses: actions/github-script@v7
        with:
          script: |
            const { Octokit } = require('@octokit/rest');
            const { bumpReleaseName } = require('./.workflows/scripts/bump_release_name.js');

            // Get the latest release
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { name: currentVersionName } = releases.data[0];
            core.info(`Discovered last release name: ${currentVersionName}`); // for example v0.1156.2

            // Bump the release version
            const bumpMode = '${{ env.CURRENT_BRANCH }}' === 'master' ? 'patch' : 'minor';
            const nextVersionName = bumpReleaseName(currentVersionName, bumpMode);
            const releaseBranchName = `${process.env.RELEASE_BRANCH_PREFIX}/${nextVersionName}`;

            // Create the release branch. We need to use a Personal Access Token here, so that creating the new branch
            // triggers the follow-up workflow on the branch. This doesn't work with the default GITHUB_TOKEN.
            core.info(`Creating new release branch: ${releaseBranchName}`);
            const octokitServiceAcc = new Octokit({ auth: '${{ secrets.serviceAccountGithubToken }}' });
            await octokitServiceAcc.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${releaseBranchName}`,
              sha: '${{ github.sha }}',
            });
