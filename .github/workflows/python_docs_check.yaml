name: Docs check

on:
  workflow_call:
    secrets:
      APIFY_SIGNING_TOKEN:
        description: Token for signing Apify packages.
        required: false
    inputs:
      python_version:
        description: Python version to use for building docs.
        required: false
        type: string
        default: "3.14"
      node_version:
        description: Node.js version to use for building docs.
        required: false
        type: string
        default: "24"
      install_command:
        description: Command to install Python dependencies.
        required: false
        type: string
        default: uv run poe install-dev
      build_docs_command:
        description: Command to build docs website.
        required: false
        type: string
        default: uv run poe build-docs

jobs:
  docs_check:
    name: Docs check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        run: ${{ inputs.install_command }}

      - name: Build docs website
        run: ${{ inputs.build_docs_command }}
        env:
          APIFY_SIGNING_TOKEN: ${{ secrets.APIFY_SIGNING_TOKEN }}
